---
site_name: "Felix' knowledge base"
site_url: https://ftschindler.github.io/knowledge/
repo_url: https://github.com/ftschindler/knowledge
copyright: 'Content <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, code MIT'
edit_uri: edit/main/docs/
extra_css:
- stylesheets/theme.css
theme:
  name: material
  # overrides/ adds the metadata card to the right-hand rail; see
  # about/tech_stack.md. It overrides Material blocks rather than copying its
  # partials, so a theme upgrade cannot silently leave a stale copy behind.
  custom_dir: overrides
  features:
  - content.action.edit
  # Render a directory's index.md when its section is clicked in the nav, rather
  # than only expanding the section. Requires the file to be named index.md.
  - navigation.indexes
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
hooks:
- hooks/publish_siblings.py
- hooks/concept_genre.py
# A concept's declared sources, rendered as the footnotes its prose cites.
- hooks/concept_sources.py
plugins:
- search
- awesome-pages
# Dated posts addressed to a reader, in `blog/` beside the bundle rather than in
# it; hooks/publish_siblings.py injects them. The plugin discovers posts by path
# and runs its own `on_files` late (priority -50) so injected files are already
# in the list, which is what makes the sibling layout work.
- blog
# The domain axis: folders carry a page's nature, tags carry its subject, so the
# tag listing is the only place the bundle can be read by subject. Listings are
# rendered wherever a page carries the `material/tags` marker; see about/tags.md.
- tags
- obsidian-support
- backlinks_section
- excalidraw
- git-revision-date-localized:
    enable_creation_date: true
    # The blog entrypoint MkDocs sees is the gitignored mirror that
    # hooks/publish_siblings.py writes into the bundle directory, so it has no
    # history to read and warns on every build, which fails --strict. The page
    # it renders is blog/index.md, which is committed.
    exclude:
    - blog/index.md
- glightbox
markdown_extensions:
- admonition
# A concept declares its sources in frontmatter and cites them by id from the
# prose; hooks/concept_sources.py writes the definitions these render.
- footnotes
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- toc:
    permalink: true

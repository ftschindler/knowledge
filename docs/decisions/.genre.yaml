# What kind of page this directory holds. One directory, one genre, so this is
# declared once here rather than copied into every page's body. The build hook
# `hooks/concept_genre.py` renders the note, and the `genre-conformance` check
# holds every concept's `type` to the one named here.
type: Decision
article: a
word: decision
note: |-
  What I chose, given my values, wishes and principles, and the reasoning
  that got me there. A decision here is one I still stand behind.
# What `draft` means here, which is not what it means elsewhere in the bundle:
# not an unfinished page, but a choice whose consequence has not happened yet.
status_notes:
  draft: |-
    Decided, not yet carried out. The choice is made and the reasoning is settled;
    nothing described here exists yet.
